<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Follow-up Texts for Meta-Ad Setting</title>
  <link rel="icon" href="spm.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .header-action {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    .action-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.35);
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .action-link-btn:hover {
      background: linear-gradient(135deg, #22d3ee, #0369a1);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
      color: #ffffff;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    label {
      display: block;
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    .dynamic-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 12px;
      color: #fff;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      min-height: 120px;
      transition: border-color 0.3s;
    }

    .dynamic-input:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 25px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 22px;
      line-height: 1.7;
      word-break: break-word;
      max-height: 520px;
      overflow-y: auto;
    }

    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
      padding-bottom: 40px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.75rem; }
      .step-card { padding: 22px; }
      .prompt-content { font-size: 0.92rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Follow-up Texts for Meta-Ad Setting</h1>
      <div class="header-action">
        <a href="https://spmhqo.github.io/plr/bnb.html" target="_blank" rel="noopener noreferrer" class="action-link-btn">
          Create BNB ↗
        </a>
      </div>
    </header>

    <div class="prompt-workflow">
      
      <!-- Multiline Dynamic Input Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Dynamic Input</span>
          <button class="clear-btn" onclick="resetInput('inputBnb')">Reset</button>
        </div>
        <label for="inputBnb">[BNB Code]</label>
        <textarea id="inputBnb" class="dynamic-input" placeholder="Paste or type [BNB Code] here..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Prompt Result Cards Container -->
      <div id="promptsContainer"></div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const templates = [
      {
        id: 1,
        text: `অনুমোদন করছি।`
      },
      {
        id: 2,
        text: `এটা ঠিক আছে। এর পরের করণীয় কাজে এগিয়ে যাও।`
      },
      {
        id: 3,
        text: `এই কাজটা আমি নিজে করে নিতে পারবো - সেলস লেটার ও সেলস পেজ তৈরির কাজে এগুনো যাক`
      },
      {
        id: 4,
        text: `সুন্দর হয়েছে - তুমিই একে রিভিউ করে প্রয়োজনীয় সংশোধন করে Sales Page-টির Final Version প্রস্তুত করো - কনভার্সন কোন ধরনের কপি ও ডিজাইনে হয় সে সম্বন্ধে আমি এক্কেবারেই কাঁচা। তাই এ ব্যাপারে আমার মতামত না প্রকাশ করাই শ্রেয়।`
      },
      {
        id: 5,
        text: `আমার বাই নাউ বাটন -

[BNB Code] 

Sales Page-এর প্রস্তাবিত ডিজাইনের সঙ্গে মিলিয়ে Buy Now বাটনটি নতুন করে ডিজাইন করে নিও। তবে Checkout URL এবং মূল্য অপরিবর্তিত রাখবে।`
      },
      {
        id: 6,
        text: `গ্রাফি কি করবে জানি না। আমি ওদের উপর নির্ভর করতে চাই না। ওটা আমি নিজেই ম্যানুয়্যালি ইমেইল করে পাঠাবো - আমি চাই তাদের সঙ্গে আলাদা করে ওয়ান-টু-ওয়ান কমিউনিকেট করতে। 

আর একটা জিনিস - আমি চাই - নিজের ডোমেইন ও হোস্টিং অ্যাকাউন্টে একটা আকর্ষণীয় সেলস পেজ তৈরি করতে - অ্যাড অ্যাঙ্গেল-র সঙ্গে সামঞ্জস্য তৈরি করে

spmukherjee.co.in আমার ডোমেইন - আলাদা সাবডোমেইন বানিয়ে নেবো প্রোডাক্টের জন্য`
      }
    ];

    function createCards() {
      const container = document.getElementById('promptsContainer');
      container.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `
          <div class="step-header">
            <span class="step-label">Prompt #${t.id}</span>
          </div>
          <div class="prompt-content" id="p${t.id}"></div>
          <button class="btn copy-btn" onclick="copyText('p${t.id}', this)">
            <span>Copy Prompt #${t.id}</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePrompts() {
      const bnbVal = document.getElementById('inputBnb').value.trim() || "[BNB Code]";

      templates.forEach(t => {
        let updatedText = t.text;
        if (t.id === 5) {
          updatedText = updatedText.split('[BNB Code]').join(bnbVal);
        }
        document.getElementById(`p${t.id}`).innerText = updatedText;
      });
    }

    function resetInput(fieldId) {
      document.getElementById(fieldId).value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize on page load
    window.onload = () => {
      createCards();
      updatePrompts();
    };
  </script>
</body>
</html>
